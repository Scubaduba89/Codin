<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codin — Home</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/rules.js"></script>
<script src="js/badges.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
</head>
<body>
<header class="site">
  <div class="brand">COD<span>IN</span></div>
  <nav>
    <a class="here" href="index.html">Home</a>
    <a href="tree.html">Skill Tree</a>
    <a href="artifacts.html">Artifacts</a>
    <a href="journey.html">Journey</a>
    <a href="quiz.html">Quiz</a>
  </nav>
  <button id="themeBtn" title="toggle light/dark">◐</button>
</header>
<main>
  <p class="asof" id="asof">loading…</p>

  <section class="card hero" id="hero"></section>
  <section class="card" id="nextcard"></section>
  <section class="card" id="wins" hidden></section>
  <section class="card" id="practice" hidden></section>

<script>
loadWorld().then((w) => {
  const s = w.state;
  asOf(s);

  // hero: level + scoped bar (never a % of curriculum)
  const hero = document.getElementById("hero");
  const line = el("div", "level-line");
  line.appendChild(el("span", "lvl", "Level " + s.level.number));
  line.appendChild(el("span", "lvlname", s.level.name));
  hero.appendChild(line);
  const bar = el("div", "xpbar");
  const fill = el("div");
  fill.style.width =
    Math.min(100, (100 * s.xp_into_level) / s.xp_for_next) + "%";
  bar.appendChild(fill);
  hero.appendChild(bar);
  const toNext = s.level.next_threshold - s.xp;
  hero.appendChild(el("div", "muted small",
    s.xp + " XP · " + toNext + " to " +
    CodinRules.levelFor(s.level.next_threshold).name));

  // next up (or first-run onboarding, or welcome-back)
  const card = document.getElementById("nextcard");
  card.appendChild(el("h2", null, "Next up"));
  const gap = daysSinceLast(s);
  if (!s.events.length) {
    card.appendChild(el("p", null,
      "Nothing recorded yet - and the first win takes five minutes. " +
      "In a terminal at the repo:"));
    card.appendChild(el("code", "next-cmd", "python3 codin.py check setup-01"));
  } else {
    if (gap !== null && gap >= 7) {
      card.appendChild(el("p", null,
        "Welcome back. No streak broke - nothing here breaks. " +
        "A ten-minute warm-up is queued for you:"));
      card.appendChild(el("code", "next-cmd", "python3 codin.py next"));
    } else {
      const nu = nextUp(w.curriculum, s);
      if (nu) {
        card.appendChild(el("p", null,
          nu.ex.title + " — ~" + nu.ex.minutes + " min, " + nu.ex.xp +
          " XP (" + nu.module.title + ")"));
        card.appendChild(el("code", "next-cmd",
          "python3 codin.py start " + nu.ex.id));
      } else {
        card.appendChild(el("p", null,
          "Everything unlocked is done. A gate is waiting to be opened - " +
          "the terminal knows which:"));
        card.appendChild(el("code", "next-cmd", "python3 codin.py next"));
      }
    }
  }

  // recent wins
  const winsCard = document.getElementById("wins");
  const wins = s.counted.filter((e) => e.type !== "review").slice(-5).reverse();
  if (wins.length) {
    winsCard.hidden = false;
    winsCard.appendChild(el("h2", null, "Recent wins"));
    const ul = el("ul", "wins");
    for (const evn of wins) {
      const li = el("li");
      li.appendChild(el("span", "when", fmtDate(evn.ts)));
      li.appendChild(el("span", null, evn.id));
      li.appendChild(el("span", "xp", "+" + evn.xp + " XP"));
      ul.appendChild(li);
    }
    winsCard.appendChild(ul);
  }

  // practice record - positive framing only
  const pr = document.getElementById("practice");
  if (s.active_days.length) {
    pr.hidden = false;
    pr.appendChild(el("h2", null, "Practice record"));
    const weekAgo = new Date(Date.now() - 6 * 86400000)
      .toISOString().slice(0, 10);
    const last7 = s.active_days.filter((d) => d >= weekAgo).length;
    const goal = (w.profile && w.profile.weekly_goal) || 3;
    pr.appendChild(el("p", "muted small",
      "Active " + last7 + " of the last 7 days" +
      (last7 >= goal ? " ✓" : "")));
    pr.appendChild(heatmap(s.active_days, 8));
  }
}).catch((e) => {
  document.getElementById("asof").textContent =
    "Couldn't load progress data (" + e.message + "). If you're viewing " +
    "this locally, serve the docs folder: python3 -m http.server";
});
</script>
</main>
</body>
</html>
